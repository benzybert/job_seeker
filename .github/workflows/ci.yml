name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install shared
        run: pip install -e packages/shared
      - name: Install ingestor deps
        run: pip install -r services/ingestor/requirements.txt
      - name: Install sender deps
        run: pip install -r services/sender/requirements.txt
      - name: Compile
        run: python -m py_compile $(git ls-files '*.py')
      - name: Run tests
        run: pip install pytest && pytest -q


