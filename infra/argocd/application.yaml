apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: job-agent-dev
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/job-agent
    targetRevision: HEAD
    path: infra/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true

