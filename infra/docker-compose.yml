version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  ingestor:
    build:
      context: ..
      dockerfile: services/ingestor/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      JOB_WEBHOOK_ENABLED: "true"
      JOB_WEBHOOK_URL: "http://host.docker.internal:8000/jobs/new"
    volumes:
      - ../services/ingestor/config.yaml:/app/config.yaml

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000
