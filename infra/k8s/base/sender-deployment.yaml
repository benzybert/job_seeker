apiVersion: v1
kind: Service
metadata:
  name: sender
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: sender
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sender
  template:
    metadata:
      labels:
        app: sender
    spec:
      containers:
        - name: sender
          image: your-dockerhub/job-agent-sender:latest
          env:
            - name: MONGO_URI
              value: mongodb://mongo:27017
            - name: RABBIT_HOST
              value: rabbitmq
            - name: APPLY_QUEUE_ENABLED
              value: "true"
          command: ["python", "-m", "app.main"]

