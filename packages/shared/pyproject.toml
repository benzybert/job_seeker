[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent-shared"
version = "0.1.0"
description = "Shared utilities and models for Job Agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "boto3>=1.28,<2",
  "python-dateutil>=2.8,<3",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
ignore = []


